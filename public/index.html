<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="./icon-192x192.png" />
    <link rel="shortcut icon" href="./icon-192x192.png" />
    <link rel="apple-touch-icon" href="./icon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#171717" />
    <meta name="description" content="Sistema de gestión integral para la empresa" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="TotalProd" />
    <title>TotalProd</title>
    <!-- Google Maps API -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCP082YGVBkcUJIS_kW2Ignr1ySbwKAOc0&libraries=places,geometry&loading=async&callback=initMap"></script>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
    <div id="root"></div>
    <script>
      // Función global para manejar la carga de Google Maps
      window.initMap = function() {
        window.googleMapsLoaded = true;
      };

      // Deshabilitar pull-to-refresh
      function disablePullToRefresh() {
        // Solo usar CSS overscroll-behavior
        document.body.style.overscrollBehavior = 'none';
        document.documentElement.style.overscrollBehavior = 'none';
      }
      
      // Start checking when the page loads
      window.addEventListener('load', function() {
        disablePullToRefresh();
      });
      
      // También ejecutar cuando el DOM esté listo
      document.addEventListener('DOMContentLoaded', disablePullToRefresh);
    </script>
  </body>
</html>
